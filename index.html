<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="todo-card">

            <div class="intro">

                <div class="intro-text">
                    <p class="subtitle">PLAN • ORGANIZE • ACHIEVE</p>

                    <h1>Task<span>Flow</span></h1>

                    <p class="description">
                        Turn your plans into progress. Organize your day,
                        complete your goals, and stay focused.
                    </p>
                </div>

                <div class="intro-image">
                    <img src="todo-illustration.png" alt="Productivity illustration">
                </div>

            </div>

            <div class="input-area">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                    autocomplete="off"
                >

                <button id="addTaskBtn">+ Add Task</button>

            </div>

            <p id="message"></p>

            <div class="task-header">
                <div>
                    <p class="small-title">YOUR PLAN</p>
                    <h2>Today's Tasks</h2>
                </div>

                <span id="taskCount">0 tasks</span>
            </div>

            <ul id="taskList"></ul>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">✓</div>
                <h3>Your task list is empty</h3>
                <p>Add your first task and start making progress.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
